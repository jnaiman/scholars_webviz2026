<!DOCTYPE html>
<!--
  A minimal web page that shows Altair/vega-lite plots saved as .json files.
  Works on ANY website or GitHub Pages repository -- no Jekyll template needed.

  To use it:
    1. Put this file and your .json files in the same folder of a repository
       that has GitHub Pages turned on (Settings -> Pages).
    2. Change the file names in the vegaEmbed(...) lines at the bottom
       (and add/remove <div>s, one per plot).
    3. Visit https://<username>.github.io/<repository>/<folder>/plot_page.html

  NOTE: opening this file by double-clicking it on your own computer won't
  load the .json files (browsers block that).  Either upload it, or run
      python -m http.server
  in this folder and go to http://localhost:8000/plot_page.html
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Altair plots</title>

  <!-- The three libraries that draw vega-lite plots (vega-lite 6, to match Altair 6) -->
  <script src="https://cdn.jsdelivr.net/npm/vega@6.2.0"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-lite@6.4.1"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-embed@7.0.2"></script>

  <style>
    body { font-family: system-ui, sans-serif; max-width: 900px; margin: 2em auto; padding: 0 1em; line-height: 1.5; }
    .plot { width: 100%; margin: 1em 0 2em 0; }
  </style>
</head>
<body>

  <h1>My Altair plots</h1>

  <h2>Upward mobility vs. income</h2>
  <p>Pick a state from the dropdown, hover over a dot, scroll to zoom.</p>
  <div id="plot1" class="plot"></div>

  <h2>Corgis born per year</h2>
  <p>Click a country in the legend to highlight it.</p>
  <div id="plot2" class="plot"></div>

  <script>
    // vegaEmbed("#id-of-the-div", "path/or/URL/to/your_plot.json")
    vegaEmbed("#plot1", "mobility_scatter.json");
    vegaEmbed("#plot2", "corgis_over_time.json");
  </script>

</body>
</html>
