# ============================================================================
# CHANGE THESE EVERY SEMESTER (part 2 of 2)
#
# This file holds who is teaching, when/where the workshop is, and every
# semester-specific link EXCEPT the course webpage and the GitHub repo -- those
# two are derived from `baseurl` in _config.yml so the repo name is only ever
# typed in one place.
#
# How to use these values:
#
#   * regular pages (index.md, syllabus.md, module*/index.md, _includes, _layouts):
#     Liquid works, so read them directly --
#       {{ site.data.class.course.semester }}
#       {% assign ms = site.data.class.urls | where: "id", "mediaspace" | first %}
#       {{ ms.url }}
#     NOTE: Liquid does NOT work inside a page's front matter (e.g. the
#     `examples:` list in module*/index.md).  To link a file in this repo from
#     there, use `type: github` with `link:` set to the path inside the repo
#     (e.g. module03/jekyll_starter) -- the layouts build the full GitHub URL.
#     Other repo-relative link types the layouts understand:
#       type: githubtree -> folder view on GitHub
#       type: githubraw  -> raw file (what "Download raw file" gives you)
#       type: colab      -> open a notebook from this repo in Google Colab
#
#   * lecture slides (module*/lecture*.md):
#     Liquid does NOT work there (reveal.js gets the raw markdown), so use the
#     ALL-CAPS placeholders that _layouts/lecture.html substitutes --
#       COURSE_WEBPAGE  COURSE_GITHUB  COURSE_NAME  COURSE_NUMBER
#       COURSE_SEMESTER COURSE_MEDIASPACE  COURSE_IS445
#       COURSE_COLAB     (= Colab URL prefix, append a repo path:
#                         COURSE_COLAB/module03/altair_to_json.ipynb)
#       COURSE_RAW       (= raw.githubusercontent.com prefix, append a repo path)
#       CV_TEMPLATE      (= the online CV template repo URL, see `urls` below)
#       CV_TEMPLATE_ZIP  (= zip download of that template)
#       STREAMLIT_TEMPLATE (= Streamlit starter repo URL, see `urls` below)
#     To add a new placeholder, add one `replace:` line in _layouts/lecture.html.
#     CAREFUL: Jekyll still *parses* slide bodies as Liquid even though it
#     shows them raw, so `{{ ... }}` in a slide is fine but a `{%` tag
#     (e.g. an `include` shown as example code) breaks the build or runs.
#     Show plain HTML instead, or link to a file in the repo.
# ============================================================================

